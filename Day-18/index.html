<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-wrap">
        <img src="images/back.png" id="backbtn">
        <div class="gallery">
        <div>
            <span><img src="images/image-1.png" alt="Image 1"></span>
            <span><img src="images/image-2.png" alt="Image 1"></span>
            <span><img src="images/image-3.png" alt="Image 1"></span>
        </div>
         <div>
            <span><img src="images/image-4.png" alt="Image 1"></span>
            <span><img src="images/image-5.png" alt="Image 1"></span>
            <span><img src="images/image-6.png" alt="Image 1"></span>
        </div>
    </div>
        <img src="images/next.png" id="nextbtn">
    </div>
    <script>
        let scrollerContainer=document.querySelector('.gallery');
        let backbtn=document.getElementById('backbtn');
        let nextbtn=document.getElementById('nextbtn');
        scrollerContainer.addEventListener('wheel',(e)=>{
            e.preventDefault();
            scrollerContainer.scrollLeft+=e.deltaY;
             scrollerContainer.style.scrollBehavior='auto';
        })
      nextbtn.addEventListener('click',()=>{
        scrollerContainer.style.scrollBehavior='smooth';
        scrollerContainer.scrollLeft+=900;
      })
      backbtn.addEventListener('click',()=>{
         scrollerContainer.style.scrollBehavior='smooth';
        scrollerContainer.scrollLeft-=900;
      })


    </script>

</body>
</html>
