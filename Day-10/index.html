<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quote-box">
        <h2>Quote of the day</h2>
        <blockquote id="quote">loading....</blockquote>
        <span id="author">loading....</span>
        <div>
            <button onclick="getQuote()">New Quote</button>
            <button onclick="tweet()">Tweet</button>
        </div>
    </div>

<script>
    const quote=document.getElementById("quote");
    const author=document.getElementById("author");

    const quotes = [
        { content: "The secret of getting ahead is getting started.", author: "Mark Twain" },
        { content: "What you do today can improve all your tomorrows.", author: "Ralph Marston" },
        { content: "It always seems impossible until it is done.", author: "Nelson Mandela" },
        { content: "Success is the sum of small efforts, repeated day in and day out.", author: "Robert Collier" },
        { content: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
        { content: "The future depends on what you do today.", author: "Mahatma Gandhi" },
        { content: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" }
    ];

    function getQuote(){
        const randomIndex = Math.floor(Math.random() * quotes.length);
        const data = quotes[randomIndex];
        quote.innerHTML = data.content;
        author.innerHTML = data.author;
    }
    function tweet(){
        window.open("https://twitter.com/compose/tweet?text=" + encodeURIComponent(quote.innerHTML + " - " + author.innerHTML));
    }
    getQuote();
</script>
</body>
</html>
