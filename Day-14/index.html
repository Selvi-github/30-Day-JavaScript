<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
     <div class="music-player">
  <nav>
    <div class="circle">
        <li class="fa-solid fa-angle-left"></li>
    </div>
     <div class="circle">
        <li class="fa-solid fa-bars"></li>
    </div>
  </nav>
  <img src="C:\Users\lenovo\OneDrive\Desktop\javascript\Day-14\468-thumbnail.png" class="song-img">
  <h1>Despacito</h1>
  <p>Luis Fonsi ft. Daddy Yankee</p>

  <audio  id="song">
    <source src="C:\Users\lenovo\OneDrive\Desktop\javascript\Day-14\despeto.mp3" type="audio/mpeg">

  </audio>
  <input type="range" value="0" id="progress">


  <div class="controls">
    <div>
        <i class="fa-solid fa-backward"></i>
    </div>
    <div onclick="playpause()">
        <i class="fa-solid fa-play" id="ctrlicon"></i>
    </div>
    <div>
        <i class="fa-solid fa-forward"></i>
    </div>
  </div>
    </div>
    </div>
   <script>
    let progress=document.getElementById("progress");
    let song = document.getElementById("song");

    let ctrlicon=document.getElementById("ctrlicon");

    song.onloadedmetadata=function(){
        progress.max=song.duration;
        progress.value=song.currentTime;;
    }
    function playpause(){
        if(ctrlicon.classList.contains("fa-pause")){
            song.pause();
            ctrlicon.classList.remove("fa-pause");
            ctrlicon.classList.add("fa-play");
        }
        else{
            song.play();
            ctrlicon.classList.remove("fa-play");
            ctrlicon.classList.add("fa-pause");
        }
    }
  if(song.play()){
    setInterval(()=>{
        progress.value=song.currentTime;
    },500);
  }
  progress.onchange=function(){
    song.play();
    song.currentTime=progress.value;
     ctrlicon.classList.remove("fa-play");
    ctrlicon.classList.add("fa-pause");
  }


   </script>
</body>
</html>
